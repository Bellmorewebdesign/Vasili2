<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Info | Vasili</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="info">
<div id="chrome"></div>

<main id="main">
  <div class="page">
    <div class="page-head"><h1>Info</h1></div>
    <div class="info-layout">
      <ul class="info-toc" aria-label="Info sections">
        <li><a href="#faq">FAQ</a></li>
        <li><a href="#custom">Custom Inquiries</a></li>
        <li><a href="#shipping">Shipping</a></li>
        <li><a href="#returns">Returns</a></li>
      </ul>
      <div>
        <section class="info-sec faq" id="faq" aria-labelledby="faq-h">
          <h2 id="faq-h">FAQ</h2>
          <details><summary>[Heading]</summary><div class="answer"><p>[Text]</p></div></details>
          <details><summary>[Heading]</summary><div class="answer"><p>[Text]</p></div></details>
          <details id="faq-origin"><summary>[Heading]</summary><div class="answer"><p>[Text]</p><p><a href="origin.html?entry=faq">See origin</a></p></div></details>
          <details><summary>[Heading]</summary><div class="answer"><p>[Text]</p></div></details>
          <details><summary>[Heading]</summary><div class="answer"><p>[Text]</p></div></details>
        </section>

        <section class="info-sec" id="custom" aria-labelledby="custom-h">
          <h2 id="custom-h">Custom Inquiries</h2>
          <h3>[Heading]</h3>
          <p>[Text]</p>
          <form class="inquiry" novalidate data-inert-form aria-describedby="inq-pending">
            <div class="form-row"><label for="inq-email">Email</label><input id="inq-email" type="email" placeholder="[Email]" autocomplete="off"></div>
            <div class="form-row"><label for="inq-text">Message</label><textarea id="inq-text" placeholder="[Text]"></textarea></div>
            <div class="form-actions"><button type="submit" disabled>Send</button><span class="mono" id="inq-pending">[Submission pending]</span></div>
          </form>
        </section>

        <section class="info-sec" id="shipping" aria-labelledby="shipping-h">
          <h2 id="shipping-h">Shipping</h2>
          <h3>[Heading]</h3>
          <p>[Text]</p>
        </section>

        <section class="info-sec" id="returns" aria-labelledby="returns-h">
          <h2 id="returns-h">Returns</h2>
          <h3>[Heading]</h3>
          <p>[Text]</p>
        </section>
      </div>
    </div>
  </div>
</main>

<footer id="strip"></footer>
